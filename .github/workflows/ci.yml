name: RoadOS AI — Production CI Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  mobile-quality-gate:
    name: Flutter Mobile Static Analysis & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Static Analysis
        run: |
          cd apps/mobile
          flutter analyze

      - name: Run Mobile Test Suite
        run: |
          cd apps/mobile
          flutter test

      - name: Build Web Release
        run: |
          cd apps/mobile
          flutter build web --release

  backend-quality-gate:
    name: NestJS Backend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NestJS API
        run: pnpm --filter backend run build

      - name: Test NestJS API
        run: pnpm --filter backend run test

  browser-e2e-verification:
    name: Browser E2E Preview & Route Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Browser E2E Verification
        env:
          TEST_TARGET_URL: 'https://rideos-ai.web.app'
          CHROME_BIN: '/usr/bin/google-chrome'
          NODE_OPTIONS: '--dns-result-order=ipv4first'
        run: node scripts/puppeteer-tests/verify_web_preview_e2e.js

      - name: Upload E2E Test Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-browser-screenshots
          path: scripts/puppeteer-tests/screenshots/
          if-no-files-found: ignore
