name: RideOS AI Enterprise Production CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

jobs:
  backend_ci:
    name: Backend API - Lint, Test & Build
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Backend Unit Tests
        run: pnpm --filter backend run test

      - name: Build Backend Bundle
        run: pnpm --filter backend run build

  mobile_ci:
    name: Mobile App - Analyze, Test & Release Build
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Analyze Flutter Code
        run: |
          cd apps/mobile
          flutter analyze

      - name: Run Flutter Unit & Integration Tests
        run: |
          cd apps/mobile
          flutter test

      - name: Build Android Release APK
        env:
          ANDROID_GOOGLE_MAPS_API_KEY: ${{ secrets.ANDROID_GOOGLE_MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          cd apps/mobile
          flutter build apk --release

      - name: Verify release APK, Maps configuration, and signing state
        env:
          ANDROID_GOOGLE_MAPS_API_KEY: ${{ secrets.ANDROID_GOOGLE_MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          apk="apps/mobile/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          ls -lh "$apk"
          if [ -n "${ANDROID_GOOGLE_MAPS_API_KEY:-}" ]; then
            echo "::notice title=Maps key configured::A Maps key was injected from the configured GitHub Actions secret."
          else
            echo "::warning title=Maps key missing::Google Maps tiles may be unavailable in this CI build. Configure ANDROID_GOOGLE_MAPS_API_KEY or GOOGLE_MAPS_API_KEY as a repository secret; the key value is never printed."
          fi
          if [ -f apps/mobile/android/key.properties ] || [ -f apps/mobile/android/app/key.properties ] || [ -f apps/mobile/key.properties ]; then
            echo "::notice title=Release signing properties found::Keystore properties are present on this runner; preserve the public certificate evidence for release review."
          else
            echo "::warning title=QA-only APK signing::No release keystore properties are provisioned on this runner. The Gradle release configuration falls back to debug signing; this APK is for QA/emulator testing, not Play Store production upload."
          fi

      - name: Free runner disk space for Android Emulator
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /
          # Remove large, unrelated preinstalled toolchains only after the APK build.
          # Keep Java, Flutter, Android SDK/NDK, CMake, Gradle caches, and repository files.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h /
          available_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          if [ "$available_kb" -lt 3000000 ]; then
            echo "::error::Less than 3 GB free on the runner; refusing to start Android Emulator and fail later with an opaque no-space error."
            exit 1
          fi

      - name: Android Emulator — Integration and Release APK Smoke Test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          ram-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            cd apps/mobile
            if ! flutter test integration_test/integration_setup_test.dart -d emulator-5554 --reporter expanded; then
              echo "::error::RideOS integration launch test failed on the Android emulator."
              adb logcat -d -t 300 | tail -n 120
              exit 1
            fi
            adb uninstall ai.rideos.app >/dev/null 2>&1 || true
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p ai.rideos.app -c android.intent.category.LAUNCHER 1
            sleep 15
            if ! adb shell pidof ai.rideos.app >/dev/null 2>&1; then
              echo "::error::Release APK did not remain running on the Android emulator."
              adb logcat -d -t 600 | tail -n 160
              exit 1
            fi
            if adb logcat -d -t 600 | grep -E 'Process: ai[.]rideos[.]app|Fatal signal.*ai[.]rideos[.]app'; then
              echo "::error::Fatal Android runtime failure detected during the release APK smoke test."
              exit 1
            fi
            echo "::notice title=Android emulator smoke test::Integration launch test passed; release APK installed and launched on Android API 35."

      - name: Report APK delivery policy
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/heads/release/')
        run: |
          echo "::notice title=APK delivery policy::GitHub Actions artifact uploads are disabled to avoid storage quota failures. Selected QA builds are published as private GitHub Release assets."

      - name: Publish APK as a GitHub Release asset
        if: |
          startsWith(github.ref, 'refs/tags/v') ||
          startsWith(github.ref, 'refs/heads/release/') ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk="apps/mobile/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            prerelease_args=()
          else
            tag="ci-apk-$GITHUB_RUN_ID"
            prerelease_args=(--prerelease)
          fi

          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --repo "$GH_REPO" --clobber
          else
            gh release create "$tag" "$apk" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "RideOS-AI Android APK $tag" \
              --notes "Automated QA APK. Source commit: $GITHUB_SHA. This is a private test build, not a statement of Google Play production readiness." \
              "${prerelease_args[@]}"
          fi

          echo "::notice title=APK published::Private release asset URL: $GITHUB_SERVER_URL/$GH_REPO/releases/tag/$tag"
