  <!-- Google Maps JS API (Asynchronous dynamic loader for RideOS Web) -->
  <script>
    (function() {
      window.__gmaps_status__ = 'uninitialized';
      window.__gmaps_error__ = null;

      // Authentic Google Maps authentication failure handler
      window.gm_authFailure = function() {
        console.error('[RideOS Maps] Google Maps authentication failed. Key may lack authorization or referrer restrictions mismatch.');
        window.__gmaps_status__ = 'auth_failed';
        window.__gmaps_error__ = 'Google Maps authentication failed (HTTP Referrer or Key restriction mismatch).';
        window.dispatchEvent(new CustomEvent('rideos-maps-error', { detail: { error: window.__gmaps_error__ } }));
      };

      function loadMapsScript(key) {
        if (window.__gmaps_loaded__) return;
        if (!key || key.trim() === '' || key.startsWith('YOUR_')) {
          console.warn('[RideOS Maps] No valid Google Maps API key provided. Interactive map rendering disabled.');
          window.__gmaps_status__ = 'unconfigured';
          window.__gmaps_error__ = 'Google Maps API key not configured.';
          return;
        }

        window.__gmaps_loaded__ = true;
        window.__gmaps_status__ = 'loading';

        var script = document.createElement('script');
        script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key.trim()) + '&libraries=places,geometry';
        script.async = true;
        script.defer = true;
        script.onload = function() {
          console.log('[RideOS Maps] Google Maps JavaScript SDK loaded successfully.');
          window.__gmaps_status__ = 'ready';
          window.dispatchEvent(new CustomEvent('rideos-maps-ready'));
        };
        script.onerror = function(err) {
          console.error('[RideOS Maps] Failed to load Google Maps SDK script.', err);
          window.__gmaps_status__ = 'load_error';
          window.__gmaps_error__ = 'Failed to load Google Maps SDK from maps.googleapis.com';
          window.dispatchEvent(new CustomEvent('rideos-maps-error', { detail: { error: window.__gmaps_error__ } }));
        };
        document.head.appendChild(script);
      }

      // Check runtime sources for API key:
      // 1. window.__RIDEOS_GOOGLE_MAPS_API_KEY__ (injected via deployment environment)
      // 2. URL search parameter 'maps_key'
      // 3. sessionStorage / localStorage
      var urlParams = new URLSearchParams(window.location.search);
      var apiKey = window.__RIDEOS_GOOGLE_MAPS_API_KEY__ ||
                   urlParams.get('maps_key') ||
                   sessionStorage.getItem('RIDEOS_GOOGLE_MAPS_API_KEY') ||
                   localStorage.getItem('RIDEOS_GOOGLE_MAPS_API_KEY') ||
                   '';

      if (apiKey && apiKey.trim() !== '' && !apiKey.startsWith('YOUR_')) {
        loadMapsScript(apiKey);
      } else {
        // Asynchronously query authorized client key from RideOS backend
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        var apiBase = isLocal ? 'http://localhost:3000/api/v1' : 'https://api.rideos.ai/api/v1';

        fetch(apiBase + '/maps/client-key', {
          headers: { 'Accept': 'application/json' },
          signal: AbortSignal.timeout(3000)
        })
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          var contentType = res.headers.get('content-type') || '';
          if (!contentType.includes('application/json')) throw new Error('Non-JSON response');
          return res.json();
        })
        .then(function(data) {
          if (data && data.apiKey && data.apiKey.trim() !== '') {
            window.__RIDEOS_GOOGLE_MAPS_API_KEY__ = data.apiKey;
            loadMapsScript(data.apiKey);
          } else {
            console.warn('[RideOS Maps] Backend returned empty Maps API key.');
            window.__gmaps_status__ = 'unconfigured';
          }
        })
        .catch(function(err) {
          console.warn('[RideOS Maps] Asynchronous key resolution skipped: ' + err.message);
          window.__gmaps_status__ = 'unconfigured';
        });
      }
    })();
  </script>
