  <!-- Google Maps Configuration Injection -->
  <script>window.__RIDEOS_GOOGLE_MAPS_API_KEY__ = "AIzaSyDr4U2-3KPMoGKtzs3TSKUHsSyTPQZsY0g";</script>
  <!-- Google Maps JS API (Dynamic loader for RideOS Web) -->
  <script>
    (function() {
      function loadMapsScript(key) {
        if (window.__gmaps_loaded__) return;
        window.__gmaps_loaded__ = true;
        var script = document.createElement('script');
        if (key && key !== 'YOUR_ACTUAL_GOOGLE_MAPS_API_KEY_HERE' && key !== 'YOUR_GOOGLE_MAPS_API_KEY_HERE') {
          script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&libraries=places,geometry';
        } else {
          script.src = 'https://maps.googleapis.com/maps/api/js?libraries=places,geometry';
        }
        script.async = false;
        document.head.appendChild(script);
      }

      var urlParams = new URLSearchParams(window.location.search);
      var apiKey = window.__RIDEOS_GOOGLE_MAPS_API_KEY__ || 
                   urlParams.get('maps_key') || 
                   localStorage.getItem('RIDEOS_GOOGLE_MAPS_API_KEY') || 
                   '';

      if (apiKey && apiKey !== 'YOUR_ACTUAL_GOOGLE_MAPS_API_KEY_HERE' && apiKey !== 'YOUR_GOOGLE_MAPS_API_KEY_HERE') {
        loadMapsScript(apiKey);
      } else {
        // Fetch client key from RideOS backend API dynamically
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'http://localhost:3000/api/v1/maps/client-key', false); // synchronous check
        try {
          xhr.send();
          if (xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            if (data && data.apiKey) {
              window.__RIDEOS_GOOGLE_MAPS_API_KEY__ = data.apiKey;
              loadMapsScript(data.apiKey);
              return;
            }
          }
        } catch (e) {}
        loadMapsScript('');
      }
    })();
  </script>
