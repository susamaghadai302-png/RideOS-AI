apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rideos-backend-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '10'
        run.googleapis.com/cpu-throttling: 'true'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: rideos-backend-runner@rideos-ai.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/rideos-ai/rideos-repo/rideos-backend-api:4f7577e
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: '1000m'
              memory: '1Gi'
          env:
            - name: NODE_ENV
              value: 'production'
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: rideos-mongo-uri
                  key: latest
            - name: REDIS_ENABLED
              value: 'false'
            - name: TIMESCALE_ENABLED
              value: 'false'
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rideos-jwt-secret
                  key: latest
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: rideos-jwt-refresh-secret
                  key: latest
            - name: GOOGLE_ROUTES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rideos-google-routes-api-key
                  key: latest
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rideos-google-maps-api-key
                  key: latest
          startupProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: 3000
            periodSeconds: 15
            failureThreshold: 3
