steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'docker/Dockerfile.backend.prod'
      - '-t'
      - '$_IMAGE_TAG'
      - '-t'
      - '$_LATEST_TAG'
      - '.'
images:
  - '$_IMAGE_TAG'
  - '$_LATEST_TAG'
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE_TAG: 'us-central1-docker.pkg.dev/rideos-ai/rideos-repo/rideos-backend-api:latest'
  _LATEST_TAG: 'us-central1-docker.pkg.dev/rideos-ai/rideos-repo/rideos-backend-api:latest'
